version: 0.2

env:
  variables:
    AWS_ACCOUNT_ID: 319353007797
    AWS_DEFAULT_REGION: ap-southeast-1
    ECR_REPO: godrej-dev-app
    CONTAINER_NAME: app

phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      - echo "Installing dependencies..."
      - npm install

      - echo "Logging in to Amazon ECR (Singapore)..."
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION |
        docker login --username AWS --password-stdin \
        $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com

  build:
    commands:
      - echo "Building React (Vite) app..."
      - npm run build

      - echo "Building Docker image..."
      - docker build -t $ECR_REPO .

      - echo "Tagging Docker image..."
      - docker tag $ECR_REPO:latest \
        $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$ECR_REPO:latest

  post_build:
    commands:
      - echo "Pushing Docker image to ECR (Singapore)..."
      - docker push \
        $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$ECR_REPO:latest

      - echo "Creating imagedefinitions.json for ECS..."
      - printf '[{"name":"%s","imageUri":"%s"}]' \
        "$CONTAINER_NAME" \
        "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$ECR_REPO:latest" \
        > imagedefinitions.json
      - cat imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json
